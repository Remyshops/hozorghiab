:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e3e6ea;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--card:#1d2125;--tx:#eceff1;--mu:#9aa3ad;--bd:#2d3339;--ok:#4ade80;--okb:#123d22;--no:#f87171;--nob:#451a1a;--ac:#60a5fa}}
:root[data-theme="dark"]{--bg:#14171a;--card:#1d2125;--tx:#eceff1;--mu:#9aa3ad;--bd:#2d3339;--ok:#4ade80;--okb:#123d22;--no:#f87171;--nob:#451a1a;--ac:#60a5fa}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:6px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px;align-items:center}
.date{font-size:16px;font-weight:700;margin-top:8px}
.sum{color:var(--mu);font-size:14px;margin-top:4px}
.st{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--bd)}
.st:last-child{border:0}
.n{width:26px;color:var(--mu);font-size:13px}
.nm{flex:1;font-size:15px}
.t{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 0;width:78px;cursor:pointer}
.p{background:var(--okb);color:var(--ok)}.a{background:var(--nob);color:var(--no)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px;flex:1;background:var(--ac);color:#fff;cursor:pointer}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;display:none}
.edit .x{display:block}
textarea{width:100%;height:220px;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;box-sizing:border-box}
#out img{width:100%;border-radius:8px;border:1px solid var(--bd)}
.hint{font-size:12px;color:var(--mu);margin:6px 0}
</style>
</head>
<body>
<h1>📋 لیست حضور و غیاب</h1>
<div class="card">
  <input id="cls" placeholder="نام کلاس / درس" value="کلاس اول دانش">
  <div class="date" id="date"></div>
  <div class="row" style="margin-top:8px"><button class="btn s" id="dprev">→ روز قبل</button><button class="btn s" id="dnext">روز بعد ←</button></div>
  <div class="row" style="margin-top:8px"><input id="dtxt" placeholder="روز و تاریخ (قابل ویرایش)"><button class="btn s" id="dres" title="برگشت به تاریخ خودکار" style="flex:0 0 46px">↺</button><button class="btn s" id="ddel" title="حذف تاریخ" style="flex:0 0 46px">🗑</button></div>
  <input type="date" id="dpick" style="margin-top:8px">
  <div class="sum" id="sum"></div>
</div>
<div class="row" style="margin-bottom:10px">
  <button class="btn s" id="allP">همه حاضر</button>
  <button class="btn s" id="allA">همه غایب</button>
  <button class="btn s" id="edt">ویرایش اسامی</button>
</div>
<div class="card" id="list"></div>
<div id="addbox" class="card" style="display:none"><div class="row"><input id="newn" placeholder="نام دانش‌آموز جدید"><button class="btn" id="addb" style="flex:0 0 70px">افزودن</button></div></div>
<div class="row" style="margin-bottom:10px">
  <button class="btn" id="bTxt">📝 خروجی متن</button>
  <button class="btn" id="bImg">🖼 خروجی عکس</button>
  <button class="btn s" id="onlyA">🚫 فقط غایبین</button>
</div>
<div id="out"></div>
<script>
const DEF=["عادل اخگریان","یوسف اسماعیلی حسین‌آبادی","حسین امیری ابراهیم محمدی","محمد انتظاری","محمدامین انصاری‌نسب","امیر علی تجاء","محمدسجاد توکلی","مهدیار جعفرپور بنادکی","سید جاوید چاکرالعباسی","سیدمحمدکیان حسینی کمال‌آبادی","ماهان حکیمی مهدی‌آبادی","امیر علی خبری","امیررضا دهقان","امیرعلی دهقان دهنوی","آریا رحیمی ببروئی","سینا زارع","محمدصالح زارع ارنان","امیرمحمد زارع سروی","محمدعماد زارع سروی","میکائیل شکاری خبر","امیرعلی شورابی مزرعه‌آخوند","امیر محمد صادقی بخی","عادل صولت نیری","کیان طاهرنژاد جوزم","علیرضا علیزاده","سینا قانعی","مهدیار لطف آبادی","محمدیزدان محمدی","یاسین مرادی","بهراد آقا بزرگی","مرصاد منتظری هدش","ابوالفضل منصوری علی‌آباد","ماهان منصوری علی‌آباد","سیدرضا موسوی فخرآبادی","امیرارسلان میدانی","امیر حسام کامل مرد"];
let names=DEF.slice(),st={},edit=false,onlyAbs=false;
try{const s=localStorage.getItem('att_names2');if(s)names=JSON.parse(s)}catch(e){}
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
let d=new Date();
function pad(n){return String(n).padStart(2,'0')}
$('dpick').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let tir=null,dmode='auto',dman='';
function fullDate(){return dmode==='none'?'':dmode==='manual'?dman:dayName()+' '+dateStr()}
function dayName(){if(tir)return tir.w;return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long'}).format(d)}
function dateStr(){if(tir)return tir.ds;return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{year:'numeric',month:'long',day:'numeric'}).format(d)}
function save(){try{localStorage.setItem('att_names2',JSON.stringify(names))}catch(e){}}
function render(){
  $('date').textContent=fullDate()||'— بدون تاریخ —';
  if(document.activeElement!==$('dtxt'))$('dtxt').value=fullDate();
  const L=$('list');L.className='card'+(edit?' edit':'');L.innerHTML='';
  let k=0;
  names.forEach((n,i)=>{
    const a=st[n]===false;
    if(onlyAbs&&!a)return;
    k++;
    const r=document.createElement('div');r.className='st';
    r.innerHTML='<span class="n">'+fa(k)+'</span><span class="nm"></span>';
    r.querySelector('.nm').textContent=n;
    const b=document.createElement('button');b.className='t '+(a?'a':'p');b.textContent=a?'غایب ✗':'حاضر ✓';
    b.onclick=()=>{st[n]=a;render()};r.appendChild(b);
    const x=document.createElement('button');x.className='x';x.textContent='🗑';
    x.onclick=()=>{names.splice(i,1);save();render()};r.appendChild(x);
    L.appendChild(r);
  });
  if(onlyAbs&&!k)L.innerHTML='<div class="sum" style="text-align:center;padding:10px">هیچ غایبی وجود ندارد 🎉</div>';
  const oa=$('onlyA');oa.className='btn '+(onlyAbs?'':'s');oa.textContent=onlyAbs?'✅ نمایش همه':'🚫 فقط غایبین';
  const ab=names.filter(n=>st[n]===false).length;
  $('sum').textContent='حاضر: '+fa(names.length-ab)+'  |  غایب: '+fa(ab)+'  |  کل: '+fa(names.length);
}
$('dtxt').oninput=e=>{dmode='manual';dman=e.target.value;$('date').textContent=dman||'— بدون تاریخ —';$('sum').dataset.k=1};
function stepDay(n){dmode='auto';tir=null;$('dpick').dataset.x=1;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);$('dpick').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());render()}
$('dprev').onclick=()=>stepDay(-1);
$('dnext').onclick=()=>stepDay(1);
$('dres').onclick=()=>{dmode='auto';render()};
$('ddel').onclick=()=>{dmode='none';$('dtxt').value='';render()};
$('dpick').onchange=e=>{dmode='auto';tir=null;const v=e.target.value.split('-');if(v.length==3){d=new Date(+v[0],+v[1]-1,+v[2]);render()}};
$('onlyA').onclick=()=>{onlyAbs=!onlyAbs;render()};
$('allP').onclick=()=>{st={};render()};
$('allA').onclick=()=>{names.forEach(n=>st[n]=false);render()};
$('edt').onclick=()=>{edit=!edit;$('addbox').style.display=edit?'block':'none';$('edt').textContent=edit?'پایان ویرایش':'ویرایش اسامی';render()};
$('addb').onclick=()=>{const v=$('newn').value.trim();if(v){names.push(v);$('newn').value='';save();render()}};
function title(){const c=$('cls').value.trim(),f=fullDate();return [c,f].filter(Boolean).join(' - ')}
function makeText(){
  const ab=names.filter(n=>st[n]===false);
  if(onlyAbs){
    let t='📋 غایبین\n'+title()+'\n\n';
    if(ab.length)t+=ab.map((n,i)=>fa(i+1)+'. '+n+' ❌').join('\n')+'\n\n❌ تعداد غایب: '+fa(ab.length)+' از '+fa(names.length);
    else t+='🎉 هیچ غایبی وجود ندارد';
    return t;
  }
  let t='📋 حضور و غیاب\n'+title()+'\n\n';
  names.forEach((n,i)=>{t+=fa(i+1)+'. '+n+' ← '+(st[n]===false?'❌ غایب':'✅ حاضر')+'\n'});
  t+='\n✅ حاضر: '+fa(names.length-ab.length)+'   ❌ غایب: '+fa(ab.length);
  if(ab.length)t+='\n\nغایبین:\n'+ab.map(n=>'• '+n).join('\n');
  return t;
}
$('bTxt').onclick=()=>{
  const t=makeText();
  const done=ok=>{
    if(ok){$('out').innerHTML='<div class="card" style="text-align:center;color:var(--ok);font-weight:700">✅ متن کپی شد</div>';setTimeout(()=>{if($('out').textContent.includes('متن کپی شد'))$('out').innerHTML=''},2500)}
    else{$('out').innerHTML='<div class="card"><textarea id="ta" readonly></textarea><div class="hint">کپی خودکار نشد؛ متن را انتخاب و کپی کنید.</div></div>';const ta=$('ta');ta.value=t;ta.focus();ta.select()}
  };
  const legacy=()=>{
    const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.focus();ta.select();ta.setSelectionRange(0,t.length);
    let ok=false;try{ok=document.execCommand('copy')}catch(e){}
    ta.remove();return ok;
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>done(true),()=>done(legacy()));
  }else done(legacy());
};
$('bImg').onclick=async()=>{
  try{await document.fonts.load('700 20px Vazirmatn')}catch(e){}
  const rows=onlyAbs?names.filter(n=>st[n]===false):names;
  const W=720,RH=46,H=150+Math.max(rows.length,1)*RH+80,S=3;
  const c=document.createElement('canvas');c.width=W*S;c.height=H*S;
  const x=c.getContext('2d');x.scale(S,S);x.direction='rtl';x.textAlign='right';
  const F='Vazirmatn,Tahoma,sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#1e3a8a';x.fillRect(0,0,W,90);
  x.fillStyle='#fff';x.font='700 24px '+F;x.fillText($('cls').value.trim()||'لیست حضور و غیاب',W-24,38);
  x.font='400 17px '+F;x.fillText((onlyAbs?'لیست غایبین':'لیست حضور و غیاب')+(fullDate()?' - '+fullDate():''),W-24,70);
  let y=110;
  x.fillStyle='#e5e7eb';x.fillRect(16,y,W-32,34);
  x.fillStyle='#111';x.font='700 15px '+F;
  x.fillText('ردیف',W-26,y+23);x.fillText('نام و نام خانوادگی',W-90,y+23);x.textAlign='center';x.fillText('وضعیت',70,y+23);x.textAlign='right';
  y+=34;
  if(!rows.length){x.fillStyle='#111';x.font='700 18px '+F;x.textAlign='center';x.fillText('هیچ غایبی وجود ندارد 🎉',W/2,y+30);x.textAlign='right';y+=RH}
  rows.forEach((n,i)=>{
    const a=st[n]===false;
    x.fillStyle=a?'#fee2e2':(i%2?'#f9fafb':'#fff');x.fillRect(16,y,W-32,RH);
    x.strokeStyle='#e5e7eb';x.strokeRect(16,y,W-32,RH);
    x.fillStyle='#111';x.font='400 16px '+F;x.fillText(fa(i+1),W-26,y+29);
    x.font='400 18px '+F;x.fillText(n,W-90,y+30);
    x.fillStyle=a?'#b91c1c':'#15803d';x.font='700 17px '+F;x.textAlign='center';
    x.fillText(a?'غایب ✗':'حاضر ✓',70,y+30);x.textAlign='right';
    y+=RH;
  });
  const ab=names.filter(n=>st[n]===false).length;
  x.fillStyle='#111';x.font='700 17px '+F;
  x.fillText(onlyAbs?('تعداد غایب: '+fa(ab)+' از '+fa(names.length)):('حاضر: '+fa(names.length-ab)+'   غایب: '+fa(ab)+'   کل: '+fa(names.length)),W-24,y+36);
  $('out').innerHTML='<div class="card" id="res"><div class="hint">در حال ساخت عکس…</div></div>';
  $('res').scrollIntoView({behavior:'smooth',block:'start'});
  c.toBlob(b=>{
    if(!b){$('res').innerHTML='<div class="hint">ساخت عکس ناموفق بود، دوباره بزنید.</div>';return}
    const url=URL.createObjectURL(b);
    const f=new File([b],'hozor-ghiab.png',{type:'image/png'});
    $('res').innerHTML='<div class="row" style="margin-bottom:8px"><button class="btn" id="shr">📤 اشتراک‌گذاری</button><a class="btn s" id="dl" download="hozor-ghiab.png" href="'+url+'" style="text-decoration:none;text-align:center;box-sizing:border-box">⬇ ذخیره</a></div><img src="'+url+'" alt="لیست"><div class="hint">یا روی عکس نگه دارید و «ذخیره تصویر» را بزنید.</div>';
    $('res').scrollIntoView({behavior:'smooth',block:'start'});
    try{$('dl').click()}catch(e){}
    $('shr').onclick=async()=>{
      try{
        if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});
        else $('dl').click();
      }catch(e){}
    };
  },'image/png');
};
render();
async function fromTimeIr(){
  try{
    const ac=new AbortController();setTimeout(()=>ac.abort(),4000);
    const r=await fetch('https://www.time.ir/',{cache:'no-store',signal:ac.signal});
    const t=new DOMParser().parseFromString(await r.text(),'text/html').body.textContent.replace(/\s+/g,' ');
    const m=t.match(/(شنبه|یکشنبه|دوشنبه|سه‌?شنبه|چهارشنبه|پنج‌?شنبه|جمعه)\s*،?\s*([۰-۹]{1,2})\s*(فروردین|اردیبهشت|خرداد|تیر|مرداد|شهریور|مهر|آبان|آذر|دی|بهمن|اسفند)\s*(?:ماه)?\s*([۰-۹]{4})/);
    if(m&&!$('dpick').dataset.x){tir={w:m[1],ds:m[2]+' '+m[3]+' '+m[4]};render()}
  }catch(e){}
}
fromTimeIr();
</script>
</body>
</html>
